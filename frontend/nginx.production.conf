server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html referencia los archivos JS/CSS con hash en el nombre -- si el
    # navegador la guarda en cache, una pestana puede seguir apuntando a un
    # bundle viejo despues de un despliegue nuevo aunque el usuario recargue,
    # porque la recarga trae el HTML cacheado en vez del real. Sin cache aqui,
    # cada recarga real siempre trae la referencia al bundle mas reciente.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
