name: prizma

services:
  prisma-mysql:
    image: mysql:8.4
    container_name: prizma-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${PRISMA_DB_NAME}
      MYSQL_USER: ${PRISMA_DB_USER}
      MYSQL_PASSWORD: ${PRISMA_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${PRISMA_DB_ROOT_PASSWORD}
      TZ: America/Lima
    volumes:
      - prizma_mysql_data:/var/lib/mysql
    networks:
      - prizma-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  prisma-legacy-api:
    build:
      context: ./legacy-api
      dockerfile: Dockerfile.production
    container_name: prizma-legacy-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: prisma-mysql
      DB_PORT: 3306
      DB_NAME: ${PRISMA_DB_NAME}
      DB_USER: ${PRISMA_DB_USER}
      DB_PASSWORD: ${PRISMA_DB_PASSWORD}
      JWT_SECRET: ${PRISMA_JWT_SECRET}
      ADMIN_PASSWORD: ${PRISMA_ADMIN_PASSWORD}
      FRONTEND_URL: ${PRISMA_FRONTEND_URL}
      GOOGLE_SHEETS_RECLUTAMIENTO_ENABLED: ${GOOGLE_SHEETS_RECLUTAMIENTO_ENABLED:-false}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID:-}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_PRIVATE_KEY: ${GOOGLE_PRIVATE_KEY:-}
      TZ: America/Lima
    volumes:
      - prizma_legacy_uploads:/app/uploads
    networks:
      - prizma-network
    depends_on:
      prisma-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const n=require('net').connect(3000,'127.0.0.1',()=>{n.end();process.exit(0)});n.on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  prisma-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
    container_name: prizma-frontend
    restart: unless-stopped
    networks:
      - prizma-network
    depends_on:
      prisma-legacy-api:
        condition: service_healthy

  prisma-nginx:
    image: nginx:1.28-alpine
    container_name: prizma-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    networks:
      - prizma-network
    depends_on:
      prisma-frontend:
        condition: service_healthy
      prisma-legacy-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 6

  certbot:
    image: certbot/certbot
    container_name: prizma-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

networks:
  prizma-network:
    name: prizma-network
    driver: bridge

volumes:
  prizma_mysql_data:
    name: prizma_mysql_data
  prizma_legacy_uploads:
    name: prizma_legacy_uploads
